[project]
name = "smart-energy-api"
version = "0.1.0"
description = "FastAPI service for the federated smart energy prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14.1",
  "email-validator>=2.3.0",
  "fastapi>=0.116.0",
  "pydantic-settings>=2.10.1",
  "pyjwt>=2.10.1",
  "pwdlib[argon2]>=0.2.1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.43",
  "psycopg[binary]>=3.2.9",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

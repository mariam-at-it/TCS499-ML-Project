[project]
name = "smart-energy-trainer"
version = "0.1.0"
description = "Trainer and orchestration worker for the federated smart energy prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "flwr[simulation]>=1.22.0",
  "holidays>=0.78",
  "httpx>=0.28.1",
  "numpy>=2.3.2",
  "opacus>=1.5.4",
  "pandas>=2.3.1",
  "psutil>=7.0.0",
  "psycopg[binary]>=3.2.9",
  "pydantic-settings>=2.10.1",
  "pwdlib[argon2]>=0.2.1",
  "requests>=2.32.5",
  "scikit-learn>=1.7.1",
  "sqlalchemy>=2.0.43",
  "torch>=2.8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "respx>=0.22.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
